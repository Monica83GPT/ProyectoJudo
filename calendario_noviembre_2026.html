<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario - Noviembre 2026</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2933;
    }

    .calendario {
      width: min(92vw, 760px);
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(31, 41, 51, 0.12);
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      color: #102a43;
    }

    .semana,
    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .semana div {
      padding: 10px 4px;
      text-align: center;
      font-weight: 700;
      color: #486581;
      background: #e6f0f8;
      border-radius: 6px;
    }

    .dias {
      margin-top: 8px;
    }

    .dia,
    .vacio {
      min-height: 78px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d9e2ec;
      background: #fbfdff;
    }

    .dia {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .domingo {
      color: #b42318;
      background: #fff4f2;
    }

    .vacio {
      background: #f0f4f8;
      border-style: dashed;
    }

    @media (max-width: 560px) {
      .calendario {
        padding: 14px;
      }

      .semana,
      .dias {
        gap: 4px;
      }

      .semana div {
        font-size: 0.78rem;
        padding: 8px 2px;
      }

      .dia,
      .vacio {
        min-height: 54px;
        padding: 7px;
      }
    }
  </style>
</head>
<body>
  <main class="calendario">
    <h1>Noviembre 2026</h1>

    <section class="semana" aria-label="Dias de la semana">
      <div>Dom</div>
      <div>Lun</div>
      <div>Mar</div>
      <div>Mie</div>
      <div>Jue</div>
      <div>Vie</div>
      <div>Sab</div>
    </section>

    <section class="dias" aria-label="Calendario de noviembre de 2026">
      <div class="dia domingo">1</div>
      <div class="dia">2</div>
      <div class="dia">3</div>
      <div class="dia">4</div>
      <div class="dia">5</div>
      <div class="dia">6</div>
      <div class="dia">7</div>

      <div class="dia domingo">8</div>
      <div class="dia">9</div>
      <div class="dia">10</div>
      <div class="dia">11</div>
      <div class="dia">12</div>
      <div class="dia">13</div>
      <div class="dia">14</div>

      <div class="dia domingo">15</div>
      <div class="dia">16</div>
      <div class="dia">17</div>
      <div class="dia">18</div>
      <div class="dia">19</div>
      <div class="dia">20</div>
      <div class="dia">21</div>

      <div class="dia domingo">22</div>
      <div class="dia">23</div>
      <div class="dia">24</div>
      <div class="dia">25</div>
      <div class="dia">26</div>
      <div class="dia">27</div>
      <div class="dia">28</div>

      <div class="dia domingo">29</div>
      <div class="dia">30</div>
      <div class="vacio"></div>
      <div class="vacio"></div>
      <div class="vacio"></div>
      <div class="vacio"></div>
      <div class="vacio"></div>
    </section>
  </main>
</body>
</html>
