<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nuevo campeonato · FMJYDA</title>
	<link rel="stylesheet" href="css/login.css?v=20261109-6">
</head>
<body class="form-page">
	<div class="topline"></div>
	<header class="access-header area-header">
		<a class="brand" href="organizador.php"><img src="imagenes/logo-fmjudo.png" alt="Logo FMJYDA"><span>FEDERACIÓN MADRILEÑA<small>JUDO Y DEPORTES ASOCIADOS</small></span></a>
		<a class="back-link" href="organizador.php">← Volver al área de organizadores</a>
	</header>
	<main class="form-shell form-shell--wide visual-form-shell">
		<section class="form-intro form-hero form-hero--championship">
			<p class="eyebrow">Control de competición</p>
			<h1>Nuevo campeonato</h1>
			<p>Crea el evento, su nivel de competición y la convocatoria pública en una sola operación.</p>
		</section>
		<section class="data-form-card">
			##errors##<div class="form-error" role="alert">#message#</div>##/errors##
			##success##<div class="form-success" role="status">#message#</div>##/success##
			<form method="post" action="organizador_campeonato_nuevo.php" enctype="multipart/form-data">
				<input type="hidden" name="csrf" value="#csrfToken#">
				<input type="hidden" name="MAX_FILE_SIZE" value="10485760">
				<div class="form-grid">
					<label><span>Nombre del campeonato</span><input name="nombre" value="#name#" maxlength="20" required></label>
					<label><span>Fecha</span><input name="fecha" type="date" value="#eventDate#" required></label>
					<label class="form-span-2"><span>Sede</span><input name="sede" value="#venue#" maxlength="100" required></label>
					<label><span>Categoría inicial</span><select name="subcategoria" required><option value="">Selecciona</option>##subcategories##<option value="#subcategoryId#" #selected#>#subcategoryName#</option>##/subcategories##</select></label>
					<label><span>Plazo de inscripción</span><input name="plazo" type="date" value="#deadline#" required></label>
					<label class="form-span-2"><span>Organismo emisor</span><input name="organismo" value="#issuer#" maxlength="100" required></label>
					<label class="form-span-2"><span>Requisitos</span><textarea name="requisitos" rows="3" required>#requirements#</textarea></label>
					<label class="form-span-2"><span>Documentación necesaria</span><textarea name="documentos" rows="3" required>#documentsValue#</textarea></label>
					<label><span>Versión de normativa</span><input name="reglamento" value="#regulation#" maxlength="100" required></label>
					<label><span>Fecha de corte de edad</span><input name="corte_edad" type="date" value="#ageCutoff#" required></label>
					<label class="official-file-field"><span>Circular de inscripción (PDF)</span><input name="circular" type="file" accept="application/pdf,.pdf" required><small>Documento oficial · máximo 10 MB</small></label>
					<label class="official-file-field"><span>Normativa de la convocatoria (PDF)</span><input name="normativa" type="file" accept="application/pdf,.pdf" required><small>Documento oficial · máximo 10 MB</small></label>
				</div>
				<div class="form-actions"><a href="organizador.php">Cancelar</a><button type="submit">Crear campeonato <span>→</span></button></div>
			</form>
		</section>
	</main>
</body>
</html>
