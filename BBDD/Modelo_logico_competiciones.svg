  <g transform="translate(1550 790)"><rect class="table added" width="510" height="260" rx="3"/><path class="head-added" d="M3 3 H507 V36 H3 Z"/><text x="255" y="27" text-anchor="middle" class="table-name">PARTICIPANTES_CUADRO (NUEVA)</text><text x="16" y="62" class="field">PK/FK idcuadro</text><text x="16" y="86" class="field">PK/FK numfederado</text><text x="16" y="110" class="field">FK idcampeonato</text><text x="16" y="134" class="field">FK idsubcategoria</text><text x="16" y="158" class="field">posicion (tras el sorteo)</text><text x="16" y="182" class="field">cabeza_serie</text><text x="16" y="218" class="note">FK compuesta a INSCRITOS:</text><text x="16" y="240" class="note">numfederado + idcampeonato + idsubcategoria</text></g>
  <g transform="translate(2200 650)"><rect class="table changed" width="570" height="406" rx="3"/><path class="head-changed" d="M3 3 H567 V36 H3 Z"/><text x="285" y="27" text-anchor="middle" class="table-name">COMBATES (MODIFICADA)</text><text x="16" y="62" class="field">PK idcombate</text><text x="16" y="86" class="field">FK idcuadro</text><text x="16" y="110" class="field">ronda</text><text x="16" y="134" class="field">tabla</text><text x="16" y="158" class="field">numcombate</text><text x="16" y="182" class="field">FK numfederado_azul</text><text x="16" y="206" class="field">FK numfederado_blanco</text><text x="16" y="230" class="field">fecha</text><text x="16" y="254" class="field">hora</text><text x="16" y="278" class="field">tatami</text><text x="16" y="302" class="field">estado</text><text x="16" y="342" class="note">FK compuestas con idcuadro a PARTICIPANTES_CUADRO.</text><text x="16" y="366" class="note">Un participante azul y otro blanco por combate.</text></g>
  <g transform="translate(1550 1150)"><rect class="table added" width="570" height="165" rx="3"/><path class="head-added" d="M3 3 H567 V36 H3 Z"/><text x="285" y="27" text-anchor="middle" class="table-name">RESULTADOS_COMBATE (NUEVA)</text><text x="16" y="62" class="field">PK/FK idcombate</text><text x="16" y="86" class="field">FK numfederado_ganador</text><text x="16" y="110" class="field">metodo_victoria</text><text x="16" y="140" class="note">Se crea solo al terminar el combate.</text></g>
  <g transform="translate(2200 1470)"><rect class="table added" width="570" height="220" rx="3"/><path class="head-added" d="M3 3 H567 V36 H3 Z"/><text x="285" y="27" text-anchor="middle" class="table-name">AVANCES_COMBATE (NUEVA)</text><text x="16" y="62" class="field">PK/FK idcombate_origen</text><text x="16" y="86" class="field">PK tipo (gana/pierde)</text><text x="16" y="110" class="field">FK idcombate_destino</text><text x="16" y="134" class="field">posicion_destino</text><text x="16" y="170" class="note">Conecta combates de distintas rondas.</text><text x="16" y="194" class="note">El perdedor avanza solo si hay repesca.</text></g>
  <g transform="translate(2200 205)"><rect class="table added" width="570" height="165" rx="3"/><path class="head-added" d="M3 3 H567 V36 H3 Z"/><text x="285" y="27" text-anchor="middle" class="table-name">FORMATOS_COMPETICION (NUEVA)</text><text x="16" y="62" class="field">PK idformato</text><text x="16" y="86" class="field">nombreformato</text><text x="16" y="110" class="field">descripcion</text></g>
  <g transform="translate(2200 405)"><rect class="table added" width="570" height="165" rx="3"/><path class="head-added" d="M3 3 H567 V36 H3 Z"/><text x="285" y="27" text-anchor="middle" class="table-name">SISTEMAS_REPESCA (NUEVA)</text><text x="16" y="62" class="field">PK idsistema_repescas</text><text x="16" y="86" class="field">nombre_sistema</text><text x="16" y="110" class="field">descripcion</text><text x="16" y="140" class="note">Incluye la opcion "Sin repesca".</text></g>

  <rect x="60" y="1810" width="2710" height="165" rx="5" fill="#f5f7f8" stroke="#cbd3d9" stroke-width="2"/>
  <text x="82" y="1848" class="table-name">MODULOS OPCIONALES (FUERA DEL CUADRO DEPORTIVO)</text>
  <text x="82" y="1883" class="legend">Para cursos y grados: EXPEDIENTES_TRAMITE (tipo, solicitante, convocatoria, club si aplica, estado, plazos y resolucion).</text>
  <text x="82" y="1914" class="legend">DOCUMENTOS_TRAMITE (FK expediente, tipo de documento, fecha de entrega y validacion). Puede anadirse en una segunda fase.</text>
  <text x="82" y="1954" class="note">El DDL actual incluye DROP DATABASE: haz copia de seguridad antes de ejecutar cualquier cambio de esquema.</text>
